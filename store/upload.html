<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="author" content="Gourab Choudhury">
    <title>Upload Files | Store Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="../images/Gourab.logo.png" type="image/x-icon">

    <style>
        /* Force normal cursor behavior - override custom cursor from main CSS */
        body, 
        a, button, input, select, textarea, [role="button"],
        *, *::before, *::after {
            cursor: auto !important;
        }

        a:hover, button:hover, [role="button"]:hover,
        label:hover {
            cursor: pointer !important;
        }

        input[type="file"] {
            cursor: pointer !important;
        }

        body {
            background-color: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        .upload-container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .upload-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .upload-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #fff;
        }

        .upload-header p {
            color: #888;
            font-size: 1.1em;
        }

        .upload-form {
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3437 100%);
            border: 1px solid #2c3437;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .form-label {
            color: #fff;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-control,
        .form-select {
            background-color: #1a1a1a;
            border: 1px solid #2c3437;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #222;
            border-color: #417E38;
            color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(65, 126, 56, 0.25);
        }

        .form-control::placeholder {
            color: #666;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 40px;
            background-color: #1a1a1a;
            border: 2px dashed #2c3437;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .file-input-label:hover {
            border-color: #417E38;
            background-color: #222;
        }

        .file-input-label.has-file {
            border-color: #417E38;
            background-color: rgba(65, 126, 56, 0.1);
        }

        .file-input-label i {
            font-size: 2em;
            color: #417E38;
        }

        .file-input {
            display: none;
        }

        .file-name {
            color: #888;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .file-name.active {
            color: #2FC291;
            font-weight: bold;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #417E38, #2FC291);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(65, 126, 56, 0.3);
        }

        .submit-btn:disabled {
            background: #2c3437;
            transform: none;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #417E38;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #2FC291;
            gap: 12px;
        }

        .alert {
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: none;
        }

        .alert-success {
            background-color: rgba(65, 126, 56, 0.2);
            color: #2FC291;
            border-left: 4px solid #2FC291;
        }

        .alert-danger {
            background-color: rgba(255, 126, 95, 0.2);
            color: #ff7e5f;
            border-left: 4px solid #ff7e5f;
        }

        .alert-info {
            background-color: rgba(106, 17, 203, 0.2);
            color: #b48edb;
            border-left: 4px solid #b48edb;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #2c3437;
            border-top: 3px solid #417E38;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="upload-container">
        <a href="../store.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Store</span>
        </a>

        <div class="upload-header">
            <h1><i class="fas fa-cloud-upload-alt"></i> Upload New File</h1>
            <p>Add files to your store automatically</p>
        </div>

        <div id="alertContainer"></div>

        <div class="upload-form">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="fileInput" class="form-label">
                        <i class="fas fa-file"></i> Select File *
                    </label>
                    <div class="file-input-wrapper">
                        <label for="fileInput" class="file-input-label" id="fileLabel">
                            <div>
                                <i class="fas fa-cloud-upload-alt"></i>
                                <div style="margin-top: 10px;">
                                    <strong>Click to browse</strong> or drag and drop
                                </div>
                                <div class="file-name" id="fileName">No file selected</div>
                            </div>
                        </label>
                        <input type="file" id="fileInput" name="file" class="file-input" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="fileType" class="form-label">
                        <i class="fas fa-tag"></i> File Type *
                    </label>
                    <select class="form-select" id="fileType" name="type" required>
                        <option value="">-- Select Type --</option>
                        <option value="jpeg">JPEG</option>
                        <option value="jpg">JPG</option>
                        <option value="png">PNG</option>
                        <option value="webp">WEBP</option>
                        <option value="pdf">PDF</option>
                        <option value="mp4">MP4</option>
                        <option value="webm">WEBM</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        <i class="fas fa-align-left"></i> Description *
                    </label>
                    <textarea class="form-control" id="description" name="description" rows="3" 
                        placeholder="Enter a brief description of the file" required></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="fas fa-upload"></i> Upload File
                </button>
            </form>

            <div class="loading" id="loadingDiv">
                <div class="spinner"></div>
                <p>Uploading file, please wait...</p>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const fileName = document.getElementById('fileName');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingDiv = document.getElementById('loadingDiv');
        const alertContainer = document.getElementById('alertContainer');

        // File input change handler
        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                fileName.textContent = file.name;
                fileName.classList.add('active');
                fileLabel.classList.add('has-file');
                
                // Auto-detect and set file type
                autoDetectFileType(file.name);
            } else {
                fileName.textContent = 'No file selected';
                fileName.classList.remove('active');
                fileLabel.classList.remove('has-file');
            }
        });

        // Drag and drop functionality
        fileLabel.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = '#417E38';
            this.style.backgroundColor = '#222';
        });

        fileLabel.addEventListener('dragleave', function(e) {
            e.preventDefault();
            if (!fileInput.files.length) {
                this.style.borderColor = '#2c3437';
                this.style.backgroundColor = '#1a1a1a';
            }
        });

        fileLabel.addEventListener('drop', function(e) {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length) {
                fileInput.files = files;
                const event = new Event('change');
                fileInput.dispatchEvent(event);
            }
        });

        // Auto-detect file type
        function autoDetectFileType(filename) {
            const extension = filename.split('.').pop().toLowerCase();
            const typeSelect = document.getElementById('fileType');
            
            // Match exact extension types
            if (extension === 'jpeg') {
                typeSelect.value = 'jpeg';
            } else if (extension === 'jpg') {
                typeSelect.value = 'jpg';
            } else if (extension === 'png') {
                typeSelect.value = 'png';
            } else if (extension === 'webp') {
                typeSelect.value = 'webp';
            } else if (extension === 'pdf') {
                typeSelect.value = 'pdf';
            } else if (extension === 'mp4') {
                typeSelect.value = 'mp4';
            } else if (extension === 'webm') {
                typeSelect.value = 'webm';
            }
        }

        // Show alert
        function showAlert(message, type) {
            alertContainer.innerHTML = `
                <div class="alert alert-${type}">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : 'info-circle'}"></i>
                    ${message}
                </div>
            `;
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        // Form submission
        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const file = fileInput.files[0];
            if (!file) {
                showAlert('Please select a file to upload', 'danger');
                return;
            }

            // Prepare form data
            const formData = new FormData();
            formData.append('file', file);
            formData.append('type', document.getElementById('fileType').value);
            formData.append('description', document.getElementById('description').value);

            // Show loading
            uploadForm.style.display = 'none';
            loadingDiv.classList.add('active');
            submitBtn.disabled = true;

            try {
                const response = await fetch('upload.php', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('✅ File uploaded successfully! Redirecting to store...', 'success');
                    uploadForm.reset();
                    fileName.textContent = 'No file selected';
                    fileName.classList.remove('active');
                    fileLabel.classList.remove('has-file');
                    
                    // Redirect to store page after 2 seconds
                    setTimeout(() => {
                        window.location.href = '../store.html';
                    }, 2000);
                } else {
                    showAlert('❌ Upload failed: ' + result.message, 'danger');
                }
            } catch (error) {
                console.error('Upload error:', error);
                showAlert('❌ An error occurred during upload. Please try again.', 'danger');
            } finally {
                uploadForm.style.display = 'block';
                loadingDiv.classList.remove('active');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
